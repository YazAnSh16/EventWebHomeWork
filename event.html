<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تفاصيل الفعاليات - دليل SVU</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">

    <style>
        body {
            font-family: sans-serif;
        }

        .card-img-top {
            height: 250px;
            object-fit: cover;
        }

        main {
            min-height: 70vh;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-warning shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">العودة للرئيسية</a>
        </div>
    </nav>

    <main class="container my-5">

        <div class="row g-4">

            <div class="col-md-4">

                <div class="card shadow-sm p-3 mb-3">
                    <h5 class="border-bottom pb-2">معلومات الفعالية</h5>
                    <p><strong>التاريخ:</strong> <span id="eventDate">-</span></p>
                    <p><strong>الوقت:</strong> <span id="eventTime">-</span></p>
                    <p><strong>المكان:</strong> <span id="eventLocation">-</span></p>
                    <p><strong>التصنيف:</strong> <span id="eventCategory">-</span></p>
                </div>

            </div>

            <div class="col-md-8">

                <img id="eventImage" src="" class="img-fluid rounded shadow mb-3">

                <h2 id="eventTitle">...</h2>

                <p class="lead" id="eventDescription">
                    ...
                </p>

                <button class="btn btn-success">أضف للتقويم</button>
                <button class="btn btn-primary">شارك الحدث</button>

            </div>

        </div>

        <hr class="my-5">

        <h4 class="mb-3">فعاليات ذات صلة</h4>

        <div class="row g-3">

            <div class="col-md-4">
                <div class="card p-3">
                    <h6>حفلة موسيقية سورية</h6>
                    <small class="text-muted">2026-05-20</small>
                </div>
            </div>

        </div>

    </main>

    <footer class="bg-warning py-4 text-center mt-5">
        <p class="mb-1">© SVU Events Guide 2026</p>

        <p class="small">
            تم التصميم بواسطة: WAJD (322099) | YAZAN (298598) | JOULIA (331019) | NOUR (271490)
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const events = {
            1: {
                title: "المهرجان الموسيقي الدولي رقم 46",
                date: "2026-05-18",
                time: "4:00 PM",
                location: "دمشق - مدينة المعارض",
                category: "موسيقي",
                image: "image/t1.jpg",
                description: "استمتع بعروض موسيقية عالمية تجمع الثقافات وتقدم تجربة فنية مميزة. احجز مبكراً لأن الأماكن محدودة."
            },
            2: {
                title: "معرض المعلومات",
                date: "2026-04-28",
                time: "10:00 AM",
                location: "دمشق",
                category: "تعليمي",
                image: "image/t9.jpg",
                description: "معرض تعليمي يقدم أحدث التقنيات والمعلومات للطلاب والباحثين."
            },
            3: {
                title: "بطولة كرة القدم",
                date: "2026-06-10",
                time: "6:00 PM",
                location: "حلب",
                category: "رياضي",
                image: "image/t8.jpg",
                description: "بطولة رياضية تجمع أفضل الفرق في سوريا."
            },
            4: {
                title: "المسابقة البرمجية التنافسية",
                date: "2026-07-15",
                time: "6:00 PM",
                location: "دمشق",
                category: "تعليمي",
                image: "image/SCPC_2.jpg",
                description: "مسابقة برمجية تنافسية عالمية يشارك فيها الطلاب من مختلف جامعات سوريا ."
            }
        };

        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        const event = events[id];

        if (event) {
            document.getElementById("eventTitle").textContent = event.title;
            document.getElementById("eventDate").textContent = event.date;
            document.getElementById("eventTime").textContent = event.time;
            document.getElementById("eventLocation").textContent = event.location;
            document.getElementById("eventCategory").textContent = event.category;
            document.getElementById("eventImage").src = event.image;
            document.getElementById("eventDescription").textContent = event.description;
        }
    </script>

</body>

</html>
